# Service Port
server.port=9000

# Gateway
# 服务发现自动路由 (lb:///{serviceId}), 供 Knife4j DISCOVER 聚合透传 /{service}/v3/api-docs
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# JWT
pets.jwt.secret=${JWT_SECRET:pets-chonglaoban-jwt-secret-key-2026-must-be-32-bytes}

# Auth White List
pets.auth.white-list[0]=/api/v1/auth/login
pets.auth.white-list[1]=/api/v1/auth/register
pets.auth.white-list[2]=/api/v1/auth/send-code
pets.auth.white-list[3]=/api/v1/auth/reset-password
pets.auth.white-list[4]=/actuator/health
# Knife4j 文档资源 (网关聚合页 + 各服务 /v3/api-docs 透传)
pets.auth.white-list[5]=/doc.html
pets.auth.white-list[6]=/webjars/**
pets.auth.white-list[7]=/v3/api-docs/**
pets.auth.white-list[8]=/*/v3/api-docs/**
pets.auth.white-list[9]=/favicon.ico

# Knife4j 聚合文档 (DISCOVER: 自动聚合 Nacos 中所有微服务的 OpenAPI3 文档)
knife4j.gateway.enabled=true
knife4j.gateway.strategy=DISCOVER
knife4j.gateway.discover.enabled=true
knife4j.gateway.discover.version=OpenAPI3
knife4j.gateway.discover.excluded-services[0]=pets-gateway
knife4j.gateway.discover.service-config.auth-service.group-name=鉴权服务
knife4j.gateway.discover.service-config.shop-service.group-name=店铺服务
knife4j.gateway.discover.service-config.system-service.group-name=系统服务
knife4j.gateway.discover.service-config.trade-service.group-name=交易服务
knife4j.gateway.discover.service-config.goods-service.group-name=商品服务
knife4j.gateway.discover.service-config.stock-service.group-name=库存服务
knife4j.gateway.discover.service-config.member-service.group-name=会员服务
knife4j.gateway.discover.service-config.market-service.group-name=营销服务
knife4j.gateway.discover.service-config.report-service.group-name=统计报表
