# Service Port
server.port=9000

# Gateway
# 服务发现自动路由 (lb:///{serviceId}), 供 Knife4j DISCOVER 聚合透传 /{service}/v3/api-docs
# Gateway 5 实际生效的新前缀
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true
# Knife4j DiscoverClientRouteServiceConvert 装配条件仍检查旧前缀属性 (Gateway 5 已忽略该前缀, 仅作开关)
spring.cloud.gateway.discovery.locator.enabled=true

# JWT
pets.jwt.secret=${JWT_SECRET:pets-chonglaoban-jwt-secret-key-2026-must-be-32-bytes}

# Auth White List (经网关 discovery locator 路由时路径带 /{service} 前缀, 用 /*/ 匹配)
pets.auth.white-list[0]=/api/v1/auth/login
pets.auth.white-list[1]=/api/v1/auth/register
pets.auth.white-list[2]=/api/v1/auth/send-code
pets.auth.white-list[3]=/api/v1/auth/reset-password
pets.auth.white-list[10]=/*/api/v1/auth/login
pets.auth.white-list[11]=/*/api/v1/auth/register
pets.auth.white-list[12]=/*/api/v1/auth/send-code
pets.auth.white-list[13]=/*/api/v1/auth/reset-password
pets.auth.white-list[4]=/actuator/health
# Knife4j 文档资源 (网关聚合页 + 各服务 /v3/api-docs 透传)
pets.auth.white-list[5]=/doc.html
pets.auth.white-list[6]=/webjars/**
pets.auth.white-list[7]=/v3/api-docs/**
pets.auth.white-list[8]=/*/v3/api-docs/**
pets.auth.white-list[9]=/favicon.ico

# Knife4j 聚合文档 (DISCOVER: 自动聚合 Nacos 中所有微服务的 OpenAPI3 文档)
knife4j.gateway.enabled=true
knife4j.gateway.strategy=discover
knife4j.gateway.discover.enabled=true
knife4j.gateway.discover.version=OpenAPI3
knife4j.gateway.discover.excluded-services[0]=pets-gateway
knife4j.gateway.discover.service-config.auth-service.group-name=\u9274\u6743\u670d\u52a1
knife4j.gateway.discover.service-config.shop-service.group-name=\u5e97\u94fa\u670d\u52a1
knife4j.gateway.discover.service-config.system-service.group-name=\u7cfb\u7edf\u670d\u52a1
knife4j.gateway.discover.service-config.trade-service.group-name=\u4ea4\u6613\u670d\u52a1
knife4j.gateway.discover.service-config.goods-service.group-name=\u5546\u54c1\u670d\u52a1
knife4j.gateway.discover.service-config.stock-service.group-name=\u5e93\u5b58\u670d\u52a1
knife4j.gateway.discover.service-config.member-service.group-name=\u4f1a\u5458\u670d\u52a1
knife4j.gateway.discover.service-config.market-service.group-name=\u8425\u9500\u670d\u52a1
knife4j.gateway.discover.service-config.report-service.group-name=\u7edf\u8ba1\u62a5\u8868
