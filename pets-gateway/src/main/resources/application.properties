# Service Port
server.port=9000

# Gateway
spring.cloud.gateway.discovery.locator.enabled=false

# JWT
pets.jwt.secret=${JWT_SECRET:pets-chonglaoban-jwt-secret-key-2026-must-be-32-bytes}

# Auth White List
pets.auth.white-list[0]=/api/v1/auth/login
pets.auth.white-list[1]=/api/v1/auth/register
pets.auth.white-list[2]=/api/v1/auth/send-code
pets.auth.white-list[3]=/api/v1/auth/reset-password
pets.auth.white-list[4]=/actuator/health
