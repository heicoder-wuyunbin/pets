name: test3-runner-mode
on:
  push:
    branches: [main]
jobs:
  runner-check:
    runs-on: self-hosted
    steps:
      - name: probe runner environment
        run: |
          echo "=== runner-mode (NO nested container) ==="
          uname -a
          pwd
          id
          echo "--- tools available on runner ---"
          which git docker sh
          echo "--- docker daemon reachable via mounted sock ---"
          docker version --format '{{.Server.Version}}' || true
          echo "--- kubectl via mounted k3s.yaml ---"
          KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get nodes -o wide || true
