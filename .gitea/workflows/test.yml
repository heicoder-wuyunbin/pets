name: test
on:
  push:
    branches: [main]
jobs:
  t:
    runs-on: self-hosted
    container:
      image: pets/ci-runner:1.0.0
      options: --network=host
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - /etc/rancher/k3s/k3s.yaml:/root/.kube/config:ro
        - /root/.ssh:/root/.ssh
    steps:
      - run: echo "hello from runner"; uname -a; which mvn docker kubectl ssh git
