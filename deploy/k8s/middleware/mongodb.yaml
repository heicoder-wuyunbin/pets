---
# ============================================================
# MongoDB 7 - 业务库 pets, root/root
# 部署到 k3s-worker1 (app-host=w1)
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: middleware
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: middleware
  labels:
    app: mongodb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      nodeSelector:
        app-host: w1
      containers:
      - name: mongodb
        image: mongo:7
        imagePullPolicy: IfNotPresent
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "root"
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: "root"
        - name: MONGO_INITDB_DATABASE
          value: "pets"
        - name: TZ
          value: "Asia/Shanghai"
        # 不覆盖 command, 让 mongo:7 的 docker-entrypoint 处理用户初始化
        # entrypoint 会读取 MONGO_INITDB_ROOT_USERNAME/PASSWORD 创建 root 用户
        # 并在 /docker-entrypoint-initdb.d/ 执行初始化脚本
        ports:
        - containerPort: 27017
          name: mongo
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /data/db
        readinessProbe:
          exec:
            command:
            - mongosh
            - --quiet
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - mongosh
            - --quiet
            - --eval
            - "db.adminCommand('ping')"
          initialDelaySeconds: 60
          periodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: middleware
spec:
  type: NodePort
  selector:
    app: mongodb
  ports:
  - name: mongo
    port: 27017
    targetPort: 27017
    nodePort: 30317
