---
# ============================================================
# Meilisearch v1.12 - 搜索, 部署到 k3s-worker2 (app-host=w2)
# 说明: 当前代码未实际连接 Meilisearch, 按"完整还原"需求部署占位
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meilisearch-pvc
  namespace: middleware
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
  namespace: middleware
  labels:
    app: meilisearch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: meilisearch
  template:
    metadata:
      labels:
        app: meilisearch
    spec:
      nodeSelector:
        app-host: w2
      containers:
      - name: meilisearch
        image: getmeili/meilisearch:v1.12
        imagePullPolicy: IfNotPresent
        env:
        - name: MEILI_MASTER_KEY
          value: "pets-meili-dev-key-2026"
        - name: MEILI_NO_ANALYTICS
          value: "true"
        - name: MEILI_ENV
          value: "development"
        ports:
        - containerPort: 7700
          name: http
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /meili_data
        readinessProbe:
          httpGet:
            path: /health
            port: 7700
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 7700
          initialDelaySeconds: 60
          periodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: meilisearch-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: meilisearch
  namespace: middleware
spec:
  type: NodePort
  selector:
    app: meilisearch
  ports:
  - name: http
    port: 7700
    targetPort: 7700
    nodePort: 30370
