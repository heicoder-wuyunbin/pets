---
# ============================================================
# RocketMQ 5.3 - namesrv + broker, 部署到 k3s-worker2 (app-host=w2)
# 说明: 当前代码未实际使用 RocketMQ(报表改为直查), 按"完整还原"需求部署占位
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: rocketmq-broker-conf
  namespace: middleware
data:
  broker.conf: |
    brokerClusterName = pets-cluster
    brokerName = broker-a
    brokerId = 0
    deleteWhen = 04
    fileReservedTime = 48
    brokerRole = ASYNC_MASTER
    flushDiskType = ASYNC_FLUSH
    autoCreateTopicEnable = true
    namesrvAddr = rocketmq-namesrv.middleware.svc.cluster.local:9876
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-namesrv
  namespace: middleware
  labels:
    app: rocketmq-namesrv
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rocketmq-namesrv
  template:
    metadata:
      labels:
        app: rocketmq-namesrv
    spec:
      nodeSelector:
        app-host: w2
      containers:
      - name: namesrv
        image: apache/rocketmq:5.3.0
        imagePullPolicy: IfNotPresent
        env:
        - name: JAVA_OPT_EXT
          value: "-Xms256m -Xmx512m"
        command: ["sh", "-c", "cd /home/rocketmq/rocketmq-5.3.0 && bin/mqnamesrv"]
        ports:
        - containerPort: 9876
          name: namesrv
        resources:
          limits:
            cpu: "500m"
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 256Mi
        readinessProbe:
          tcpSocket:
            port: 9876
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 9876
          initialDelaySeconds: 30
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: rocketmq-namesrv
  namespace: middleware
spec:
  selector:
    app: rocketmq-namesrv
  ports:
  - name: namesrv
    port: 9876
    targetPort: 9876
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-broker
  namespace: middleware
  labels:
    app: rocketmq-broker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rocketmq-broker
  template:
    metadata:
      labels:
        app: rocketmq-broker
    spec:
      nodeSelector:
        app-host: w2
      containers:
      - name: broker
        image: apache/rocketmq:5.3.0
        imagePullPolicy: IfNotPresent
        env:
        - name: NAMESRV_ADDR
          value: "rocketmq-namesrv.middleware.svc.cluster.local:9876"
        - name: JAVA_OPT_EXT
          value: "-Xms512m -Xmx1g"
        command: ["sh", "-c", "cd /home/rocketmq/rocketmq-5.3.0 && bin/mqbroker -c conf/broker.conf"]
        ports:
        - containerPort: 10909
          name: vip
        - containerPort: 10911
          name: client
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: brokerconf
          mountPath: /home/rocketmq/rocketmq-5.3.0/conf/broker.conf
          subPath: broker.conf
        readinessProbe:
          tcpSocket:
            port: 10911
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 10911
          initialDelaySeconds: 60
          periodSeconds: 30
      volumes:
      - name: brokerconf
        configMap:
          name: rocketmq-broker-conf
---
apiVersion: v1
kind: Service
metadata:
  name: rocketmq-broker
  namespace: middleware
spec:
  type: NodePort
  selector:
    app: rocketmq-broker
  ports:
  - name: client
    port: 10911
    targetPort: 10911
    nodePort: 30911
  - name: vip
    port: 10909
    targetPort: 10909
    nodePort: 30909
