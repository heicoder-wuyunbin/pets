apiVersion: v1
kind: Namespace
metadata:
  name: ci
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: ci
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: ci
  labels:
    app: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      nodeSelector:
        app-host: w2
      containers:
        - name: gitea
          image: gitea/gitea:1.23
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GITEA__server__APP_DATA_PATH
              value: /data/gitea
            - name: GITEA__server__PROTOCOL
              value: http
            - name: GITEA__server__HTTP_PORT
              value: "3000"
            - name: GITEA__server__ROOT_URL
              value: http://192.168.100.128:30000/
            - name: GITEA__server__SSH_DOMAIN
              value: 192.168.100.128
            - name: GITEA__server__START_SSH_SERVER
              value: "false"
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__security__SECRET_KEY
              value: "pets-ci-secret-key-change-me"
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__security__DEFAULT_ADMIN_USER
              value: admin
            - name: GITEA__security__DEFAULT_ADMIN_PASSWORD
              value: "Gitea@2026"
            - name: GITEA__security__DEFAULT_ADMIN_EMAIL
              value: admin@pets.local
            - name: GITEA__actions__ENABLED
              value: "true"
            - name: GITEA__actions__DEFAULT_ACTIONS_URL
              value: https://gitea.com
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: ci
spec:
  type: NodePort
  selector:
    app: gitea
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30000
