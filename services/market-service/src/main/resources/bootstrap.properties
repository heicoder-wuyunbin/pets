# Application Name
spring.application.name=market-service

# Nacos 服务发现 + 配置中心 (192.168.110.200:8848)
spring.cloud.nacos.discovery.enabled=true
spring.cloud.nacos.discovery.server-addr=192.168.110.200:8848
spring.cloud.nacos.discovery.username=nacos
spring.cloud.nacos.discovery.password=nacos
spring.cloud.nacos.discovery.group=DEFAULT_GROUP

spring.cloud.nacos.config.enabled=true
spring.cloud.nacos.config.server-addr=192.168.110.200:8848
spring.cloud.nacos.config.username=nacos
spring.cloud.nacos.config.password=nacos
spring.cloud.nacos.config.group=DEFAULT_GROUP
spring.cloud.nacos.config.file-extension=properties

# 开启服务发现注册与负载均衡 (lb:// 路由所需)
spring.cloud.discovery.enabled=true
spring.cloud.service-registry.auto-registration.enabled=true
spring.cloud.loadbalancer.enabled=true

# Service Port
server.port=9008
