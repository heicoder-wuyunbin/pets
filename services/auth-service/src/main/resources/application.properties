# Service Port
server.port=9001

# MySQL DataSource
spring.datasource.url=jdbc:mysql://${DB_HOST:192.168.110.200}:${DB_PORT:3306}/${DB_NAME:pets_auth}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis
spring.data.redis.host=${REDIS_HOST:192.168.110.200}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# MongoDB (Spring Boot 4 prefix: spring.mongodb, NOT spring.data.mongodb)
spring.mongodb.uri=mongodb://${MONGO_USER:root}:${MONGO_PASSWORD:root}@${MONGO_HOST:192.168.110.200}:${MONGO_PORT:27017}/${MONGO_DB:pets_auth}?authSource=admin

# MyBatis-Plus
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=input

# JWT
pets.jwt.secret=${JWT_SECRET:pets-chonglaoban-jwt-secret-key-2026-must-be-32-bytes}
pets.jwt.expire-minutes=${JWT_EXPIRE:720}

# ID Generator
pets.id-generator.step=1000
pets.id-generator.prefetch-threshold=0.2

# Knife4j API 文档 (http://localhost:9001/doc.html)
knife4j.enable=true
